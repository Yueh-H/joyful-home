[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "joyful-home"
version = "0.2.0"
description = "愉悅的家庭管家 — Grocy household companion"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.34,<1",
    "httpx>=0.28,<1",
    "google-genai>=1.60,<3",
    "python-dotenv>=1,<2",
    "pillow>=11,<13",
    "google-cloud-firestore>=2.21,<3",
    "pymongo>=4.18,<5",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[tool.setuptools]
packages = ["server"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
